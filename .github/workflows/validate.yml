name: Validate public release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run state-validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate fixture and release integrity
        run: python evals/validate_fixtures.py
      - name: Validate JSON documents
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool evals/rubric.json >/dev/null
          python -m json.tool evals/results/fixture-integrity.json >/dev/null
